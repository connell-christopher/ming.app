<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#F7F2EC" />
<meta name="description" content="ming — people, moments and possibilities around you." />
<title>ming</title>

<script>
(function () {
  try {
    var t = localStorage.getItem('ming-theme');

    if (t !== 'light' && t !== 'dark') {
      t = matchMedia('(prefers-color-scheme: dark)').matches
        ? 'dark'
        : 'light';
    }

    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>

<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="spaces.css" />
<link rel="stylesheet" href="moonflower.css" />
</head>

<body>

<!-- ============================================================
     MING AUTHENTICATION
============================================================ -->

<section id="auth-screen" class="auth-screen">

  <div class="auth-card">

    <div class="auth-brand">
      <div class="auth-logo">☾</div>
      <h1>Welcome to Ming</h1>
      <p>Find your people. Share your world.</p>
    </div>


    <!-- LOGIN -->

    <form id="login-form" class="auth-form">

      <h2>Welcome back</h2>

      <p class="auth-subtitle">
        Sign in to continue to Ming.
      </p>

      <div class="field">

        <label for="login-email">
          Email address
        </label>

        <input
          id="login-email"
          type="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        />

      </div>


      <div class="field">

        <label for="login-password">
          Password
        </label>

        <input
          id="login-password"
          type="password"
          placeholder="Your password"
          autocomplete="current-password"
          required
        />

      </div>


      <button
        type="submit"
        class="btn btn--primary"
      >
        Sign in
      </button>


      <p
        id="login-message"
        class="auth-message"
      ></p>


      <p class="auth-switch">

        Don't have an account?

        <button
          type="button"
          id="show-signup"
        >
          Create one
        </button>

      </p>

    </form>


    <!-- SIGNUP -->

    <form
      id="signup-form"
      class="auth-form"
      hidden
    >

      <h2>Create your account</h2>

      <p class="auth-subtitle">
        Your space in the Ming universe.
      </p>


      <div class="field">

        <label for="signup-name">
          Display name
        </label>

        <input
          id="signup-name"
          type="text"
          placeholder="Your name"
          autocomplete="name"
          required
        />

      </div>


      <div class="field">

        <label for="signup-username">
          Username
        </label>

        <input
          id="signup-username"
          type="text"
          placeholder="yourusername"
          autocomplete="username"
          required
        />

      </div>


      <div class="field">

        <label for="signup-email">
          Email address
        </label>

        <input
          id="signup-email"
          type="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        />

      </div>


      <div class="field">

        <label for="signup-password">
          Password
        </label>

        <input
          id="signup-password"
          type="password"
          placeholder="At least 6 characters"
          autocomplete="new-password"
          minlength="6"
          required
        />

      </div>


      <button
        type="submit"
        class="btn btn--primary"
      >
        Create account
      </button>


      <p
        id="signup-message"
        class="auth-message"
      ></p>


      <p class="auth-switch">

        Already have an account?

        <button
          type="button"
          id="show-login"
        >
          Sign in
        </button>

      </p>

    </form>

  </div>

</section>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>

</body>
</html>
