<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#F7F2EC" />
<meta name="description" content="ming — people, moments and possibilities around you." />
<title>ming</title>

<script>
(function () {
  try {
    var t = localStorage.getItem('ming-theme');

    if (t !== 'light' && t !== 'dark') {
      t = matchMedia('(prefers-color-scheme: dark)').matches
        ? 'dark'
        : 'light';
    }

    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>

<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="spaces.css" />
</head>

<body>

<!-- ============================================================
     MING AUTHENTICATION
============================================================ -->

<section id="auth-screen" class="auth-screen">

  <div class="auth-card">

    <div class="auth-brand">
      <div class="auth-logo" aria-label="Ming lunar mark">
        <svg viewBox="0 0 80 80" role="img" aria-hidden="true" focusable="false">
          <defs>
            <linearGradient id="auth-moon-fill" x1="18%" y1="8%" x2="86%" y2="92%">
              <stop offset="0%" stop-color="#fff0d7"/>
              <stop offset="100%" stop-color="#d8a77b"/>
            </linearGradient>
          </defs>
          <path class="auth-moon-core" d="M48.5 11.5a28.5 28.5 0 1 0 20 45.8A23.3 23.3 0 0 1 48.5 11.5Z" fill="url(#auth-moon-fill)"/>
          <path class="auth-moon-orbit" d="M12.5 49.5C18 26.8 39.6 13.8 61.8 21.2" fill="none" stroke="#f1d2ae" stroke-width="1.6" stroke-linecap="round"/>
          <circle class="auth-moon-orbit-dot" cx="13" cy="49" r="3.1" fill="#f1d2ae"/>
          <path class="auth-moon-star" d="M62.5 12.8l2.1 5.1 5.1 2.1-5.1 2.1-2.1 5.1-2.1-5.1-5.1-2.1 5.1-2.1z" fill="#fff0d7"/>
          <circle cx="45.5" cy="39.5" r="2" fill="#7c3341" opacity=".82"/>
        </svg>
      </div>
      <h1>Welcome to Ming</h1>
      <p>Find your people. Share your world.</p>
    </div>


    <!-- LOGIN -->

    <form id="login-form" class="auth-form">

      <h2>Welcome back</h2>

      <p class="auth-subtitle">
        Sign in to continue to Ming.
      </p>

      <div class="field">

        <label for="login-email">
          Email address
        </label>

        <input
          id="login-email"
          type="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        />

      </div>


      <div class="field">

        <label for="login-password">
          Password
        </label>

        <input
          id="login-password"
          type="password"
          placeholder="Your password"
          autocomplete="current-password"
          required
        />

      </div>


      <button
        type="submit"
        class="btn btn--primary"
      >
        Sign in
      </button>


      <p
        id="login-message"
        class="auth-message"
      ></p>


      <p class="auth-switch">

        Don't have an account?

        <button
          type="button"
          id="show-signup"
        >
          Create one
        </button>

      </p>

    </form>


    <!-- SIGNUP -->

    <form
      id="signup-form"
      class="auth-form"
      hidden
    >

      <h2>Create your account</h2>

      <p class="auth-subtitle">
        Your space in the Ming universe.
      </p>


      <div class="field">

        <label for="signup-name">
          Display name
        </label>

        <input
          id="signup-name"
          type="text"
          placeholder="Your name"
          autocomplete="name"
          required
        />

      </div>


      <div class="field">

        <label for="signup-username">
          Username
        </label>

        <input
          id="signup-username"
          type="text"
          placeholder="yourusername"
          autocomplete="username"
          required
        />

      </div>


      <div class="field">

        <label for="signup-email">
          Email address
        </label>

        <input
          id="signup-email"
          type="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        />

      </div>


      <div class="field">

        <label for="signup-password">
          Password
        </label>

        <input
          id="signup-password"
          type="password"
          placeholder="At least 6 characters"
          autocomplete="new-password"
          minlength="6"
          required
        />

      </div>


      <button
        type="submit"
        class="btn btn--primary"
      >
        Create account
      </button>


      <p
        id="signup-message"
        class="auth-message"
      ></p>


      <p class="auth-switch">

        Already have an account?

        <button
          type="button"
          id="show-login"
        >
          Sign in
        </button>

      </p>

    </form>

  </div>

</section>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js?v=20261004-stable-1"></script>

</body>
</html>
